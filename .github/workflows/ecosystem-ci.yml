name: ecosystem-ci

on:
  push:
  pull_request:

jobs:
  xuna_shared:
    name: xuna_shared (pure Dart shared types & BLE constants)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/xuna_shared
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: "stable"
          cache: true
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test --reporter expanded

  xuna_xtp:
    name: xuna_xtp (pure Dart contract & golden vectors)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop/packages/xuna_xtp
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: "stable"
          cache: true
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test --reporter expanded

  desktop:
    name: xuna_desktop (Flutter analyze & test)
    runs-on: ubuntu-24.04
    needs: xuna_xtp
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: "stable"
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --reporter expanded

  mobile:
    name: xuna_mobile (Flutter analyze & test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: "stable"
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --reporter expanded

  backend:
    name: xuna_backend (pytest & ruff)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: xuna
          POSTGRES_PASSWORD: xuna
          POSTGRES_DB: xuna_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U xuna" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      XUNA_TEST_DATABASE_URL: postgresql+psycopg://xuna:xuna@localhost:5432/xuna_test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: PY="$(dirname "$(which python)")" scripts/check.sh
